{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2 id="m-title">회의 상세</h2>
  <dl class="meta">
    <div><dt>파일명</dt><dd id="m-file">-</dd></div>
    <div><dt>재생시간</dt><dd id="m-duration">-</dd></div>
    <div><dt>언어</dt><dd id="m-lang">-</dd></div>
    <div><dt>화자 수</dt><dd id="m-speakers">-</dd></div>
    <div><dt>분석 상태</dt><dd id="m-status">-</dd></div>
  </dl>
  <p id="m-error" class="error"></p>
  <div id="speaker-editor"></div>
  <p><a href="/chat?meeting_id={{ meeting_id }}">이 회의에 대해 질문하기 →</a></p>
</section>

<section class="card">
  <h2>회의록</h2>
  <div id="transcript" class="transcript"><p class="msg">불러오는 중…</p></div>
</section>
{% endblock %}
{% block script %}<script>initMeeting({{ meeting_id }});</script>{% endblock %}
