{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>회의 음성 업로드</h2>
  <form id="upload-form">
    <label>회의 제목 <input type="text" name="title" placeholder="예: 8월 3주차 개발 회의"></label>
    <label>음성 파일 <input type="file" name="file" accept=".wav,.mp3,.m4a,.flac,.ogg,.webm,.mp4" required></label>
    <button type="submit">업로드 후 분석 시작</button>
    <span id="upload-msg" class="msg"></span>
  </form>
</section>

<section class="card">
  <h2>회의 목록</h2>
  <table id="meeting-table">
    <thead><tr><th>ID</th><th>회의명</th><th>파일</th><th>재생시간</th><th>화자</th><th>상태</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}
{% block script %}<script>initIndex();</script>{% endblock %}
