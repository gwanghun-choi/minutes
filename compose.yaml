# PostgreSQL is the existing external instance - never started here. It runs as
# its own compose project (minutes-postgres) and is reached by container name
# over the shared external network below, so DATABASE_HOST=minutes-postgres.
services:
  minutes:
    build:
      context: .
      # Build-time only, and only for `npm ci` in the frontend stage. See the
      # comment in the Dockerfile; without a TLS-inspecting proxy it is unused.
      secrets:
        - ca_bundle
    image: minutes:latest
    container_name: minutes
    restart: unless-stopped
    env_file: .env
    ports:
      - "18080:8000"
    volumes:
      - models:/models      # HF + faster-whisper model cache survives rebuilds
      - uploads:/app/data   # uploaded audio survives rebuilds
      # Trust the host's CA store. Required behind a TLS-inspecting corporate
      # proxy (model downloads fail with CERTIFICATE_VERIFY_FAILED otherwise);
      # harmless elsewhere.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    # Uncomment on a host with the NVIDIA Container Runtime:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# Every container this file creates - `up`, and one-off `run` containers such as
# the migration - joins the network PostgreSQL is already on. Without this,
# Compose invents an implicit `minutes_default` per project, a `run` container
# lands there alone, and `minutes-postgres` does not resolve.
# The network is external because PostgreSQL owns its lifetime, not this file.
# Create it once per host before the first `up`:
#   docker network inspect minutes-net >/dev/null 2>&1 || docker network create minutes-net
networks:
  default:
    external: true
    name: minutes-net

volumes:
  models:
  uploads:

secrets:
  ca_bundle:
    file: /etc/ssl/certs/ca-certificates.crt
